<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Графика | Нуйкин Владимир Дмитриевич</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@300..700&family=Geologica:wght@100..900&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap&subset=cyrillic"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/painting.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
    <link rel="stylesheet" href="/css/graphics-layout.css">
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
</head>
<body>

<div class="desktop-layout">
    <div class="graphics-header-container">
        <div class="nav-icons">
            <div class="image-wrapper" onclick="animateTransition('/index.html')" title="Главная" style="margin-right: 15px;">
                <img src="/assets/images/pictograms/main.png" alt="Главная" class="hover-image">
            </div>

            <div class="title-section"  style="margin-right: 150px; margin-bottom: 12px;">
                <p>Графика</p>
            </div>

            <div class="image-wrapper" onclick="animateTransition('/bio.html')" title="Биография">
                <img src="/assets/images/pictograms/bio.png" alt="Биография" class="hover-image">
            </div>
            <div class="image-wrapper" onclick="animateTransition('/graphics.html')" title="Графика">
                <img src="/assets/images/pictograms/graphics.png" alt="Графика" class="hover-image">
            </div>
            <div class="image-wrapper" onclick="animateTransition('/painting.html')" title="Живопись">
                <img src="/assets/images/pictograms/painting.png" alt="Живопись" class="hover-image">
            </div>
            <div class="image-wrapper" onclick="animateTransition('/misc.html')" title="Всякое">
                <img src="/assets/images/pictograms/miscellaneous.png" alt="Всякое" class="hover-image">
            </div>
        </div>
    </div>

    <div class="gallery-container">
        <div class="gallery-grid">
        </div>
    </div>

    <nav class="nav-bottom">
    </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
<script src="/js/gallery-data.js"></script>
<script src="/js/albums/4.js"></script>
<script src="/js/albums/5.js"></script>
<script src="/js/gallery-engine.js"></script>
<script src="/js/main_scripts.js"></script>
<script src="/js/animation.js"></script>
<script>
    lightbox.option({
        'resizeDuration': 200,
        'wrapAround': true,
        'alwaysShowNavOnTouchDevices': false, // Отключаем постоянный показ на тач-устройствах
        'disableScrolling': true,
        'showImageNumberLabel': false // Скрываем метку с номером (дополнительно к CSS)
    });
</script>
</body>
</html>
